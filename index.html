<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>RoadGame 3D</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        #game {
            position: fixed;
            inset: 0;
        }

        #menu {
            position: fixed;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 420px);
            padding: 25px;
            border-radius: 22px;
            background: rgba(15,15,20,.94);
            color: white;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,.45);
        }

        #menu h1 {
            margin: 0 0 10px;
            font-size: 34px;
        }

        #location {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            margin: 10px 0;
        }

        .button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: 0;
            border-radius: 12px;
            background: #2878ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        #message {
            min-height: 22px;
            margin-top: 12px;
            font-size: 14px;
        }

        #hud {
            display: none;
            position: fixed;
            z-index: 5;
            top: 12px;
            left: 12px;
            right: 12px;
            color: white;
        }

        #info {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0,0,0,.65);
        }

        #cameraButtons {
            position: fixed;
            z-index: 6;
            right: 15px;
            top: 15px;
            display: none;
        }

        #cameraButtons button {
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            margin: 3px;
            background: rgba(0,0,0,.7);
            color: white;
            font-size: 20px;
        }

        #controls {
            position: fixed;
            z-index: 6;
            left: 15px;
            bottom: 20px;
            display: none;
            width: 170px;
            text-align: center;
        }

        #controls button {
            width: 52px;
            height: 52px;
            margin: 3px;
            border: 0;
            border-radius: 14px;
            background: rgba(0,0,0,.7);
            color: white;
            font-size: 21px;
            font-weight: bold;
        }

        #vehicle {
            position: fixed;
            z-index: 6;
            right: 15px;
            bottom: 20px;
            display: none;
        }

        #vehicle button {
            display: block;
            width: 140px;
            padding: 10px;
            margin: 4px;
            border: 0;
            border-radius: 10px;
            background: rgba(0,0,0,.75);
            color: white;
        }

        #loading {
            display: none;
            position: fixed;
            z-index: 20;
            inset: 0;
            background: rgba(0,0,0,.75);
            color: white;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
        }

        @media(max-width:500px) {
            #menu {
                padding: 20px;
            }

            #menu h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        🗺️ Génération de la ville...<br><br>
        <small>Construction de la route et des bâtiments</small>
    </div>
</div>

<div id="menu">
    <h1>🚗 RoadGame</h1>

    <p>Entre une ville ou une adresse</p>

    <input
        id="location"
        type="text"
        placeholder="Ex : Villepinte"
        autocomplete="off"
    >

    <button id="play" class="button">
        ▶️ Générer la map
    </button>

    <div id="message"></div>
</div>

<div id="hud">
    <div id="info">📍 RoadGame 3D</div>
</div>

<div id="cameraButtons">
    <button id="leftCamera">↶</button>
    <button id="rightCamera">↷</button>
</div>

<div id="controls">
    <button data-move="forward">▲</button>
    <br>
    <button data-move="left">◀</button>
    <button data-move="back">▼</button>
    <button data-move="right">▶</button>
</div>

<div id="vehicle">
    <button data-car="car">🚗 Voiture</button>
    <button data-car="truck">🚛 Camion</button>
    <button data-car="bus">🚌 Bus</button>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<!-- Ton jeu -->
<script src="game.js"></script>

</body>
</html>
