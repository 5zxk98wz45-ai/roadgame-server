<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RoadGame</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#18231d;
    font-family:Arial,sans-serif;
    color:white;
}
button,input{
    font:inherit;
}
.hidden{
    display:none !important;
}
.screen{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:auto;
}
#loadingScreen{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#111;
    z-index:1000;
}
.loadingTitle{
    font-size:38px;
    font-weight:bold;
    margin-bottom:25px;
}
.loadingBar{
    width:80%;
    max-width:420px;
    height:18px;
    border-radius:20px;
    background:#333;
    overflow:hidden;
}
#loadingProgress{
    width:0%;
    height:100%;
    background:#21c79a;
    transition:width:.2s;
}
#loadingText{
    margin-top:15px;
    color:#ccc;
}
.authContainer,
.menuContainer{
    width:min(92%,500px);
    margin:50px auto;
    padding:25px;
    border-radius:25px;
    background:#10171b;
    text-align:center;
}
h1{
    font-size:34px;
    margin:10px 0 20px;
}
h2{
    margin:10px 0 25px;
}
input{
    width:100%;
    padding:16px;
    margin:7px 0;
    border:0;
    border-radius:14px;
    outline:none;
    background:#252e32;
    color:white;
}
button{
    border:0;
    color:white;
    background:#161d21;
    border-radius:16px;
    padding:15px 20px;
    cursor:pointer;
    touch-action:manipulation;
}
.primaryButton{
    background:#20b98c;
    color:white;
}
.fullButton{
    width:100%;
}
.menuButton{
    display:block;
    width:100%;
    margin:10px 0;
    font-size:18px;
}
#authMessage,
#multiplayerMessage,
#privateRoomMessage,
#usernameMessage{
    min-height:22px;
    margin-top:12px;
}
.addressBox{
    margin-top:25px;
    padding:18px;
    background:#182126;
    border-radius:20px;
    text-align:left;
}
.addressBox h3{
    margin-top:0;
}
#addressResult{
    margin-top:12px;
    font-size:14px;
    color:#bbb;
}
.addressFound{
    padding:12px;
    border-radius:12px;
    background:#24352e;
    margin-top:8px;
}
.vehicleCard{
    padding:18px;
    margin:8px 0;
    width:100%;
    background:#20292d;
    border-radius:15px;
}
.vehicleCard.selected{
    outline:3px solid #20b98c;
}
.playerItem{
    padding:12px;
    margin:6px 0;
    background:#20282c;
    border-radius:12px;
}
#gameHud{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#26362c;
}
#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}
.hudTop{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.hudBox{
    background:#10171b;
    padding:17px 25px;
    border-radius:22px;
    font-size:18px;
}
.hudButtons{
    position:absolute;
    top:130px;
    right:25px;
    display:flex;
    flex-direction:column;
    gap:14px;
}
.hudButton{
    width:140px;
    min-height:65px;
    font-size:18px;
}
.joystick{
    position:absolute;
    left:50px;
    bottom:70px;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(90,100,95,.55);
    border:4px solid rgba(255,255,255,.35);
    touch-action:none;
}
.joystickStick{
    position:absolute;
    width:125px;
    height:125px;
    left:50%;
    top:50%;
    margin-left:-62.5px;
    margin-top:-62.5px;
    border-radius:50%;
    background:#20b98c;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
    pointer-events:none;
}
#mapScreen{
    background:#111;
    z-index:500;
}
#map{
    position:absolute;
    inset:0;
}
.mapTop{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    z-index:600;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.mapTop button{
    pointer-events:auto;
}
.mapControls{
    position:absolute;
    right:20px;
    bottom:30px;
    z-index:600;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.mapControls button{
    width:55px;
    height:55px;
    font-size:25px;
}
#pauseScreen{
    z-index:800;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
}
.pauseBox{
    width:min(90%,400px);
    background:#11191d;
    padding:25px;
    border-radius:25px;
    text-align:center;
}
@media(max-width:700px){
    .joystick{
        width:220px;
        height:220px;
        left:35px;
        bottom:35px;
    }
    .joystickStick{
        width:110px;
        height:110px;
        margin-left:-55px;
        margin-top:-55px;
    }
    .hudButtons{
        right:15px;
        top:110px;
    }
    .hudButton{
        width:120px;
        min-height:60px;
        padding:10px;
    }
    .hudBox{
        padding:14px 18px;
        font-size:16px;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     CHARGEMENT
===================================================== -->
<div id="loadingScreen">
    <div class="loadingTitle">🚗 RoadGame</div>
    <div class="loadingBar">
        <div id="loadingProgress"></div>
    </div>
    <div id="loadingText">
        Chargement...
    </div>
</div>
<!-- =====================================================
     AUTH
===================================================== -->
<div id="authScreen" class="screen hidden">
    <div class="authContainer">
        <h1>🚗 RoadGame</h1>
        <input
            id="usernameInput"
            type="text"
            placeholder="Pseudo"
            autocomplete="username"
        >
        <input
            id="passwordInput"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >
        <button
            id="loginButton"
            class="primaryButton fullButton">
            🔑 Se connecter
        </button>
        <button
            id="registerButton"
            class="menuButton">
            📝 Créer un compte
        </button>
        <button
            id="guestButton"
            class="menuButton">
            👤 Jouer en invité
        </button>
        <div id="authMessage"></div>
    </div>
</div>
<!-- =====================================================
     MENU
===================================================== -->
<div id="mainMenu" class="screen hidden">
    <div class="menuContainer">
        <h1>🚗 RoadGame</h1>
        <h2 id="welcomeText">
            Bienvenue
        </h2>
        <button
            id="playButton"
            class="menuButton primaryButton">
            ▶️ Jouer
        </button>
        <button
            id="quickMatchButton"
            class="menuButton">
            ⚡ Partie rapide
        </button>
        <button
            id="multiplayerButton"
            class="menuButton">
            🌐 Multijoueur
        </button>
        <button
            id="garageButton"
            class="menuButton">
            🚗 Garage
        </button>
        <button
            id="shopButton"
            class="menuButton">
            🛒 Boutique
        </button>
        <button
            id="friendsButton"
            class="menuButton">
            👥 Amis
        </button>
        <button
            id="settingsButton"
            class="menuButton">
            ⚙️ Paramètres
        </button>
        <!-- ADRESSE -->
        <div class="addressBox">
            <h3>📍 Où veux-tu apparaître ?</h3>
            <input
                id="addressInput"
                type="text"
                placeholder="Ex : Villepinte, France"
            >
            <button
                id="searchAddressButton"
                class="primaryButton fullButton">
                🔎 Rechercher l'adresse
            </button>
            <div id="addressResult"></div>
        </div>
    </div>
</div>
<!-- =====================================================
     MULTIJOUEUR
===================================================== -->
<div id="multiplayerScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>🌐 Multijoueur</h1>
        <button
            id="quickMatchButton2"
            class="menuButton primaryButton">
            ⚡ Partie rapide
        </button>
        <button
            id="createRoomButton"
            class="menuButton">
            ➕ Créer une partie
        </button>
        <button
            id="createPrivateRoomButton"
            class="menuButton">
            🔒 Partie privée
        </button>
        <input
            id="roomCodeInput"
            placeholder="Code de la partie"
        >
        <input
            id="roomPasswordInput"
            type="password"
            placeholder="Mot de passe si nécessaire"
        >
        <button
            id="joinRoomButton"
            class="menuButton primaryButton">
            🚪 Rejoindre
        </button>
        <div id="multiplayerMessage"></div>
        <button
            data-close="multiplayerScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     PARTIE PRIVÉE
===================================================== -->
<div id="privateRoomScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>🔒 Partie privée</h1>
        <input
            id="privatePasswordInput"
            type="password"
            placeholder="Mot de passe"
        >
        <button
            id="confirmPrivateRoomButton"
            class="menuButton primaryButton">
            Créer
        </button>
        <div id="privateRoomMessage"></div>
        <button
            data-close="privateRoomScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     ROOM
===================================================== -->
<div id="roomScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>🚗 Partie</h1>
        <h2>
            Code :
            <span id="currentRoomCode">------</span>
        </h2>
        <div id="playersList"></div>
        <button
            id="startRoomButton"
            class="menuButton primaryButton">
            ▶️ Commencer
        </button>
        <button
            id="leaveRoomButton"
            class="menuButton">
            ← Quitter
        </button>
    </div>
</div>
<!-- =====================================================
     GARAGE
===================================================== -->
<div id="garageScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>🚗 Garage</h1>
        <div id="garageVehicles"></div>
        <p id="selectedVehicleText"></p>
        <button
            id="spawnVehicleButton"
            class="menuButton primaryButton">
            🚗 Utiliser
        </button>
        <button
            data-close="garageScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     BOUTIQUE
===================================================== -->
<div id="shopScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>🛒 Boutique</h1>
        <div id="shopVehicles"></div>
        <button
            data-close="shopScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     AMIS
===================================================== -->
<div id="friendsScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>👥 Amis</h1>
        <input
            id="friendUsernameInput"
            placeholder="Pseudo du joueur"
        >
        <button
            id="sendFriendRequestButton"
            class="menuButton primaryButton">
            ➕ Ajouter
        </button>
        <h3>Demandes</h3>
        <div id="friendRequestsList"></div>
        <h3>Amis</h3>
        <div id="friendsList"></div>
        <button
            data-close="friendsScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     PARAMÈTRES
===================================================== -->
<div id="settingsScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>⚙️ Paramètres</h1>
        <label>
            <input
                id="soundToggle"
                type="checkbox"
                checked>
            🔊 Sons
        </label>
        <br><br>
        <label>
            <input
                id="musicToggle"
                type="checkbox"
                checked>
            🎵 Musique
        </label>
        <button
            id="changeUsernameButton"
            class="menuButton">
            ✏️ Changer de pseudo
        </button>
        <button
            id="logoutButton"
            class="menuButton">
            🚪 Déconnexion
        </button>
        <button
            data-close="settingsScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     CHANGER PSEUDO
===================================================== -->
<div id="usernameScreen" class="screen hidden">
    <div class="menuContainer">
        <h1>✏️ Pseudo</h1>
        <input
            id="newUsernameInput"
            placeholder="Nouveau pseudo"
        >
        <button
            id="confirmUsernameButton"
            class="menuButton primaryButton">
            Modifier
        </button>
        <div id="usernameMessage"></div>
        <button
            data-close="usernameScreen"
            class="menuButton">
            ← Retour
        </button>
    </div>
</div>
<!-- =====================================================
     JEU
===================================================== -->
<div id="gameHud" class="hidden">
    <canvas id="gameCanvas"></canvas>
    <div class="hudTop">
        <div class="hudBox">
            👤 <span id="hudPlayerName">Invité</span>
        </div>
        <div class="hudBox">
            <span id="hudVehicle">🚗 car</span>
        </div>
    </div>
    <div class="hudButtons">
        <button
            id="mapButton"
            class="hudButton">
            🗺️ Carte
        </button>
        <button
            id="menuGameButton"
            class="hudButton">
            ☰ Menu
        </button>
        <button
            id="enterVehicleButton"
            class="hudButton">
            🚗 Entrer
        </button>
        <button
            id="exitVehicleButton"
            class="hudButton">
            🚶 Sortir
        </button>
    </div>
    <!-- UN SEUL CONTRÔLE DE CONDUITE -->
    <div id="joystick" class="joystick">
        <div
            id="joystickStick"
            class="joystickStick">
        </div>
    </div>
</div>
<!-- =====================================================
     CARTE OSM
===================================================== -->
<div id="mapScreen" class="screen hidden">
    <div id="map"></div>
    <div class="mapTop">
        <button
            id="closeMapButton">
            ✕ Fermer
        </button>
    </div>
    <div class="mapControls">
        <button id="mapZoomIn">+</button>
        <button id="mapZoomOut">−</button>
    </div>
</div>
<!-- =====================================================
     PAUSE
===================================================== -->
<div id="pauseScreen" class="hidden">
    <div class="pauseBox">
        <h1>⏸️ Pause</h1>
        <button
            id="resumeButton"
            class="menuButton primaryButton">
            ▶️ Reprendre
        </button>
        <button
            id="pauseSettingsButton"
            class="menuButton">
            ⚙️ Paramètres
        </button>
        <button
            id="exitGameButton"
            class="menuButton">
            🚪 Quitter
        </button>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>
