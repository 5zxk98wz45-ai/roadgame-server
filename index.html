<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RoadGame</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #72bdf0;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

button {
    border: 0;
    cursor: pointer;
}

#menu {
    position: fixed;
    z-index: 50;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(92%, 420px);
    padding: 25px;
    border-radius: 22px;
    background: rgba(15,15,20,.94);
    color: white;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

#menu h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

#location {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.menuButton {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border-radius: 12px;
    background: #2878ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#message {
    min-height: 22px;
    margin-top: 12px;
    font-size: 14px;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.78);
    color: white;
    text-align: center;
    font-size: 20px;
}

#hud {
    position: fixed;
    z-index: 20;
    left: 12px;
    top: 12px;
    display: none;
}

#info {
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0,0,0,.72);
    color: white;
}

#osm {
    margin-top: 5px;
    font-size: 11px;
    color: rgba(255,255,255,.75);
}

#controls {
    position: fixed;
    z-index: 20;
    left: 12px;
    bottom: 18px;
    width: 180px;
    display: none;
    text-align: center;
}

#controls button {
    width: 54px;
    height: 54px;
    margin: 3px;
    border-radius: 15px;
    background: rgba(0,0,0,.72);
    color: white;
    font-size: 21px;
    font-weight: bold;
}

#camera {
    position: fixed;
    z-index: 20;
    right: 12px;
    top: 12px;
    display: none;
}

#camera button {
    width: 48px;
    height: 48px;
    margin-left: 4px;
    border-radius: 50%;
    background: rgba(0,0,0,.72);
    color: white;
    font-size: 21px;
}

#vehiclePanel {
    position: fixed;
    z-index: 20;
    right: 12px;
    bottom: 18px;
    width: 145px;
    display: none;
}

#vehiclePanel button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 10px;
    background: rgba(0,0,0,.72);
    color: white;
}

@media(max-width:500px) {
    #menu {
        padding: 20px;
    }

    #menu h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        🗺️ Génération de la vraie carte...<br><br>
        <small id="loadingText">
            Recherche du lieu...
        </small>
    </div>
</div>

<div id="menu">

    <h1>🚗 RoadGame</h1>

    <p>
        Entre une ville ou une adresse
    </p>

    <input
        id="location"
        type="text"
        placeholder="Ex : Villepinte"
        autocomplete="off"
    >

    <button
        id="play"
        class="menuButton"
    >
        ▶️ Générer la map
    </button>

    <div id="message"></div>

</div>

<div id="hud">

    <div id="info">
        📍 RoadGame
    </div>

    <div id="osm">
        Données cartographiques © OpenStreetMap
    </div>

</div>

<div id="camera">

    <button id="camLeft">↶</button>
    <button id="camRight">↷</button>

</div>

<div id="controls">

    <button data-control="forward">▲</button>

    <br>

    <button data-control="left">◀</button>
    <button data-control="back">▼</button>
    <button data-control="right">▶</button>

</div>

<div id="vehiclePanel">

    <button data-vehicle="car">
        🚗 Voiture
    </button>

    <button data-vehicle="truck">
        🚛 Camion
    </button>

    <button data-vehicle="bus">
        🚌 Bus
    </button>

</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>

</body>
</html>
