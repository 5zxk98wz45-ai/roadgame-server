<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RoadGame</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #75bff0;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

button {
    cursor: pointer;
}

#menu {
    position: fixed;
    z-index: 50;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 400px);
    padding: 25px;
    border-radius: 22px;
    background: rgba(15,15,20,.94);
    color: white;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

#menu h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

#location {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.menuButton {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 0;
    border-radius: 12px;
    background: #2878ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#message {
    min-height: 22px;
    margin-top: 12px;
}

#hud {
    position: fixed;
    z-index: 20;
    left: 12px;
    top: 12px;
    display: none;
}

#info {
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0,0,0,.7);
    color: white;
}

#cameraControls {
    position: fixed;
    z-index: 20;
    right: 12px;
    top: 12px;
    display: none;
}

#cameraControls button {
    width: 48px;
    height: 48px;
    margin-left: 5px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    color: white;
    font-size: 22px;
}

#controls {
    position: fixed;
    z-index: 20;
    left: 12px;
    bottom: 18px;
    width: 175px;
    display: none;
    text-align: center;
}

#controls button {
    width: 52px;
    height: 52px;
    margin: 3px;
    border: 0;
    border-radius: 14px;
    background: rgba(0,0,0,.72);
    color: white;
    font-size: 21px;
    font-weight: bold;
}

#vehiclePanel {
    position: fixed;
    z-index: 20;
    right: 12px;
    bottom: 18px;
    width: 145px;
    display: none;
}

#vehiclePanel button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 0;
    border-radius: 10px;
    background: rgba(0,0,0,.72);
    color: white;
}

#multiplayerUI {
    position: fixed;
    z-index: 100;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    width: min(92%, 350px);
    padding: 15px;
    border-radius: 18px;
    background: rgba(10,10,15,.94);
    color: white;
    display: none;
    text-align: center;
}

#multiplayerUI button {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 0;
    border-radius: 10px;
    background: #2878ff;
    color: white;
    font-weight: bold;
}

#mpClose {
    background: #444 !important;
}

#mpStatus {
    margin-bottom: 8px;
}

#mpRoom {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: #222;
}

#mpPlayers {
    margin-top: 10px;
}

#openMP {
    position: fixed;
    z-index: 30;
    right: 12px;
    top: 70px;
    display: none;
    padding: 10px 14px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.7);
    color: white;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.75);
    color: white;
    text-align: center;
    font-size: 20px;
}

@media(max-width:500px) {
    #menu {
        padding: 20px;
    }

    #menu h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        🗺️ Génération de la map...<br><br>
        <small>Création de la ville 3D</small>
    </div>
</div>

<div id="menu">
    <h1>🚗 RoadGame</h1>
    <p>Choisis une ville ou une adresse</p>

    <input
        id="location"
        type="text"
        placeholder="Ex : Villepinte"
        autocomplete="off"
    >

    <button id="play" class="menuButton">
        ▶️ Jouer
    </button>

    <button id="openMultiplayer" class="menuButton">
        🌐 Multijoueur
    </button>

    <div id="message"></div>
</div>

<div id="hud">
    <div id="info">📍 RoadGame</div>
</div>

<div id="cameraControls">
    <button id="camLeft">↶</button>
    <button id="camRight">↷</button>
</div>

<div id="controls">
    <button data-control="forward">▲</button>
    <br>
    <button data-control="left">◀</button>
    <button data-control="back">▼</button>
    <button data-control="right">▶</button>
</div>

<div id="vehiclePanel">
    <button data-vehicle="car">🚗 Voiture</button>
    <button data-vehicle="truck">🚛 Camion</button>
    <button data-vehicle="bus">🚌 Bus</button>
</div>

<button id="openMP">
    🌐 Multijoueur
</button>

<div id="multiplayerUI">

    <div id="mpStatus">
        🔴 Hors ligne
    </div>

    <button id="mpCreate">
        ➕ Créer une partie
    </button>

    <button id="mpJoin">
        🔗 Rejoindre une partie
    </button>

    <div id="mpRoom">
        Code : <strong id="mpRoomCode"></strong>
    </div>

    <div id="mpPlayers">
        👥 Joueurs : 1
    </div>

    <button id="mpClose">
        Fermer
    </button>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<!-- Jeu -->
<script src="game.js"></script>

</body>
</html>
