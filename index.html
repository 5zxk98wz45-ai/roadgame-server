<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RoadGame</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#72bff0;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

button{
    border:0;
    font-family:Arial,sans-serif;
}

#menu{
    position:fixed;
    z-index:50;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92%,430px);
    padding:25px;
    border-radius:24px;
    background:rgba(12,15,22,.96);
    color:white;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

#menu h1{
    margin:0;
    font-size:36px;
}

#location{
    width:100%;
    padding:15px;
    margin:15px 0 8px;
    border:0;
    border-radius:13px;
    font-size:16px;
    outline:none;
}

.menuButton{
    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:13px;
    background:#2878ff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.menuButton:active{
    transform:scale(.97);
}

#message{
    min-height:20px;
    margin-top:12px;
    font-size:14px;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
    color:white;
    text-align:center;
    font-size:20px;
}

#hud{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    right:12px;
    pointer-events:none;
}

#locationName{
    display:inline-block;
    max-width:75%;
    padding:10px 14px;
    border-radius:13px;
    background:rgba(0,0,0,.72);
    color:white;
    font-size:14px;
}

#miniMap{
    position:fixed;
    z-index:30;
    right:12px;
    top:12px;
    width:145px;
    height:145px;
    border-radius:17px;
    overflow:hidden;
    border:3px solid white;
    background:#ddd;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

#miniMapCanvas{
    width:100%;
    height:100%;
    display:block;
}

#mapHint{
    position:absolute;
    bottom:5px;
    left:0;
    right:0;
    text-align:center;
    color:white;
    font-size:10px;
    text-shadow:0 1px 3px #000;
}

#joystick{
    position:fixed;
    z-index:30;
    left:22px;
    bottom:25px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(0,0,0,.25);
    border:2px solid rgba(255,255,255,.35);
    display:none;
}

#stick{
    position:absolute;
    width:64px;
    height:64px;
    left:40px;
    top:40px;
    border-radius:50%;
    background:rgba(255,255,255,.8);
    box-shadow:0 5px 15px rgba(0,0,0,.35);
}

#cameraButtons{
    position:fixed;
    z-index:30;
    right:12px;
    bottom:25px;
    display:none;
}

.circleButton{
    width:50px;
    height:50px;
    margin:4px;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:20px;
}

#fullscreenMap{
    position:fixed;
    z-index:200;
    inset:0;
    display:none;
    background:#e7e1d5;
}

#fullMapCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#closeMap{
    position:absolute;
    z-index:5;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(0,0,0,.8);
    color:white;
    font-size:24px;
}

#mapTitle{
    position:absolute;
    z-index:5;
    top:15px;
    left:15px;
    padding:12px 16px;
    border-radius:12px;
    background:rgba(0,0,0,.8);
    color:white;
    font-weight:bold;
}

#multiplayer{
    position:fixed;
    z-index:150;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
}

#multiBox{
    width:min(90%,390px);
    padding:25px;
    border-radius:22px;
    background:#11151d;
    color:white;
    text-align:center;
}

#multiBox input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:0;
    border-radius:10px;
}

.multiButton{
    width:100%;
    padding:13px;
    margin-top:7px;
    border-radius:10px;
    background:#2878ff;
    color:white;
    font-weight:bold;
}

#closeMulti{
    background:#444;
}

#vehiclePanel{
    position:fixed;
    z-index:35;
    right:12px;
    bottom:90px;
    width:150px;
    display:none;
}

#vehiclePanel button{
    width:100%;
    margin-top:5px;
    padding:10px;
    border-radius:10px;
    background:rgba(0,0,0,.72);
    color:white;
}

@media(max-width:500px){
    #miniMap{
        width:120px;
        height:120px;
    }

    #joystick{
        width:130px;
        height:130px;
    }

    #stick{
        left:33px;
        top:33px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        🗺️ Génération de la ville...
        <br><br>
        <small id="loadingText">Recherche du lieu...</small>
    </div>
</div>

<div id="menu">
    <h1>🚗 RoadGame</h1>

    <p>Choisis une ville ou une adresse</p>

    <input
        id="location"
        type="text"
        placeholder="Ex : Villepinte"
        autocomplete="off"
    >

    <button id="play" class="menuButton">
        ▶️ Générer la map
    </button>

    <button id="multiMenu" class="menuButton">
        🌐 Multijoueur
    </button>

    <div id="message"></div>
</div>

<div id="hud">
    <div id="locationName">
        📍 RoadGame
    </div>
</div>

<div id="miniMap">
    <canvas id="miniMapCanvas"></canvas>
    <div id="mapHint">Appuie pour ouvrir la carte</div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="cameraButtons">
    <button id="cameraLeft" class="circleButton">↶</button>
    <button id="cameraRight" class="circleButton">↷</button>
</div>

<div id="vehiclePanel">
    <button data-vehicle="car">🚗 Voiture</button>
    <button data-vehicle="truck">🚛 Camion</button>
    <button data-vehicle="bus">🚌 Bus</button>
</div>

<div id="fullscreenMap">
    <div id="mapTitle">🗺️ Carte de la zone</div>
    <button id="closeMap">✕</button>
    <canvas id="fullMapCanvas"></canvas>
</div>

<div id="multiplayer">
    <div id="multiBox">
        <h2>🌐 Multijoueur</h2>

        <p id="multiStatus">
            Choisis une partie
        </p>

        <input
            id="playerName"
            placeholder="Ton pseudo"
            maxlength="20"
        >

        <button class="multiButton" id="createRoom">
            ➕ Créer une partie
        </button>

        <input
            id="roomCode"
            placeholder="Code de la partie"
            maxlength="10"
        >

        <button class="multiButton" id="joinRoom">
            🚪 Rejoindre
        </button>

        <button class="multiButton" id="closeMulti">
            Fermer
        </button>
    </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>

</body>
</html>
