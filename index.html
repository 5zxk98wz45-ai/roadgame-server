<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RoadGame 3D</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111820;
    color: white;
}

.hidden {
    display: none !important;
}

.screen {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    background:
        linear-gradient(135deg,#17251e,#263b2d);
}

.menuContainer {
    width: min(92%,520px);
    margin: 30px auto;
    padding: 25px;
    background: rgba(10,15,18,.92);
    border-radius: 25px;
}

h1 {
    text-align: center;
    font-size: 34px;
}

h2,
h3 {
    text-align: center;
}

input {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: 0;
    border-radius: 14px;
    font-size: 17px;
    background: #eef2f4;
    color: #111;
}

button {
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
}

.menuButton,
.primaryButton {
    width: 100%;
    padding: 16px;
    margin: 7px 0;
    border-radius: 15px;
    background: #151c22;
    color: white;
    font-size: 18px;
}

.primaryButton {
    background: #19b889;
}

.fullButton {
    width: 100%;
}

.message {
    min-height: 25px;
    text-align: center;
    margin: 10px;
}

.addressBox {
    margin-top: 25px;
    padding: 18px;
    background: #202b32;
    border-radius: 18px;
}

#addressResult {
    margin-top: 10px;
    text-align: center;
    line-height: 1.4;
}

.addressSuccess {
    color: #45e69b;
}

.addressError {
    color: #ff6767;
}

#loadingScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.loadingBox {
    width: min(90%,420px);
    padding: 30px;
    background: #111820;
    border-radius: 25px;
}

.loadingBar {
    height: 14px;
    margin-top: 20px;
    border-radius: 10px;
    background: #303b42;
    overflow: hidden;
}

#loadingFill {
    width: 0%;
    height: 100%;
    background: #20c997;
    transition: width .2s;
}

.vehicleCard {
    width: 100%;
    padding: 15px;
    margin: 6px 0;
    border-radius: 14px;
    background: #1c262c;
    color: white;
    font-size: 17px;
}

.vehicleCard.selected {
    outline: 3px solid #20c997;
}

#gameHud {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #17251e;
}

#gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

.hudTop {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.hudBox {
    background: rgba(12,18,22,.9);
    padding: 17px 22px;
    border-radius: 20px;
    font-size: 18px;
}

.hudButtons {
    position: absolute;
    top: 130px;
    right: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.hudButton {
    padding: 17px 22px;
    border-radius: 20px;
    background: rgba(12,18,22,.92);
    color: white;
    font-size: 18px;
}

#joystick {
    position: absolute;
    left: 35px;
    bottom: 45px;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(90,100,100,.45);
    border: 4px solid rgba(255,255,255,.35);
    touch-action: none;
}

#joystickStick {
    position: absolute;
    width: 105px;
    height: 105px;
    left: 50%;
    top: 50%;
    margin-left: -52.5px;
    margin-top: -52.5px;
    border-radius: 50%;
    background: #20bd91;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
    pointer-events: none;
}

#mapScreen {
    position: fixed;
    inset: 0;
    background: #111;
    z-index: 50;
}

#mapCanvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

.mapTop {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.mapTop button {
    pointer-events: auto;
    padding: 14px 20px;
    border-radius: 15px;
    background: rgba(15,20,24,.9);
    color: white;
    font-size: 18px;
}

#notifications {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    width: min(90%,400px);
    pointer-events: none;
}

.notification {
    background: rgba(10,15,18,.95);
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    text-align: center;
}

#playersList {
    max-height: 250px;
    overflow-y: auto;
}

.playerItem {
    padding: 12px;
    margin: 5px 0;
    background: #202b32;
    border-radius: 12px;
}

.emptyText {
    text-align: center;
    opacity: .7;
}

.pauseOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pauseBox {
    width: min(90%,400px);
    padding: 25px;
    border-radius: 25px;
    background: #111820;
}

@media (max-width:600px) {
    #joystick {
        width: 165px;
        height: 165px;
    }

    #joystickStick {
        width: 90px;
        height: 90px;
        margin-left: -45px;
        margin-top: -45px;
    }

    .hudTop {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- CHARGEMENT -->

<div id="loadingScreen" class="screen">
    <div class="loadingBox">
        <h1>🚗 RoadGame</h1>
        <p id="loadingText">Chargement...</p>

        <div class="loadingBar">
            <div id="loadingFill"></div>
        </div>
    </div>
</div>


<!-- AUTH -->

<div id="authScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🚗 RoadGame</h1>

        <input
            id="usernameInput"
            type="text"
            placeholder="Pseudo">

        <input
            id="passwordInput"
            type="password"
            placeholder="Mot de passe">

        <button
            id="loginButton"
            class="primaryButton">
            🔑 Se connecter
        </button>

        <button
            id="registerButton"
            class="menuButton">
            📝 Créer un compte
        </button>

        <button
            id="guestButton"
            class="menuButton">
            👤 Jouer en invité
        </button>

        <div
            id="authMessage"
            class="message">
        </div>

    </div>
</div>


<!-- MENU -->

<div id="mainMenu" class="screen hidden">
    <div class="menuContainer">

        <h1>🚗 RoadGame</h1>

        <h2 id="welcomeText">
            Bienvenue
        </h2>

        <button
            id="playButton"
            class="menuButton primaryButton">
            ▶️ Jouer
        </button>

        <button
            id="quickMatchButton"
            class="menuButton">
            ⚡ Partie rapide
        </button>

        <button
            id="multiplayerButton"
            class="menuButton">
            🌐 Multijoueur
        </button>

        <button
            id="garageButton"
            class="menuButton">
            🚗 Garage
        </button>

        <button
            id="shopButton"
            class="menuButton">
            🛒 Boutique
        </button>

        <button
            id="friendsButton"
            class="menuButton">
            👥 Amis
        </button>

        <button
            id="settingsButton"
            class="menuButton">
            ⚙️ Paramètres
        </button>


        <!-- ADRESSE -->

        <div class="addressBox">

            <h3>📍 Où veux-tu apparaître ?</h3>

            <input
                id="addressInput"
                type="text"
                placeholder="Ex : Villepinte, France">

            <button
                id="searchAddressButton"
                class="primaryButton fullButton">
                🔎 Rechercher l'adresse
            </button>

            <div id="addressResult"></div>

        </div>

    </div>
</div>


<!-- MULTIJOUEUR -->

<div id="multiplayerScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🌐 Multijoueur</h1>

        <button
            id="quickMatchButton2"
            class="primaryButton">
            ⚡ Partie rapide
        </button>

        <button
            id="createRoomButton"
            class="menuButton">
            ➕ Créer une partie
        </button>

        <button
            id="createPrivateRoomButton"
            class="menuButton">
            🔒 Créer une partie privée
        </button>

        <input
            id="roomCodeInput"
            placeholder="Code de partie">

        <input
            id="roomPasswordInput"
            type="password"
            placeholder="Mot de passe si nécessaire">

        <button
            id="joinRoomButton"
            class="primaryButton">
            🚪 Rejoindre
        </button>

        <p id="multiplayerMessage" class="message"></p>

        <button
            data-close="multiplayerScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- PARTIE PRIVÉE -->

<div id="privateRoomScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🔒 Partie privée</h1>

        <input
            id="privatePasswordInput"
            type="password"
            placeholder="Mot de passe">

        <button
            id="confirmPrivateRoomButton"
            class="primaryButton">
            Créer
        </button>

        <p
            id="privateRoomMessage"
            class="message">
        </p>

        <button
            data-close="privateRoomScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- ROOM -->

<div id="roomScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🚗 Partie</h1>

        <h2>
            Code :
            <span id="currentRoomCode">---</span>
        </h2>

        <div id="playersList"></div>

        <button
            id="startRoomButton"
            class="primaryButton">
            ▶️ Démarrer
        </button>

        <button
            id="leaveRoomButton"
            class="menuButton">
            🚪 Quitter
        </button>

    </div>
</div>


<!-- GARAGE -->

<div id="garageScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🚗 Garage</h1>

        <div id="garageVehicles"></div>

        <button
            id="spawnVehicleButton"
            class="primaryButton">
            ✅ Utiliser
        </button>

        <button
            data-close="garageScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- BOUTIQUE -->

<div id="shopScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>🛒 Boutique</h1>

        <div id="shopVehicles"></div>

        <button
            data-close="shopScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- AMIS -->

<div id="friendsScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>👥 Amis</h1>

        <input
            id="friendUsernameInput"
            placeholder="Pseudo">

        <button
            id="sendFriendRequestButton"
            class="primaryButton">
            ➕ Ajouter
        </button>

        <h3>Demandes</h3>
        <div id="friendRequestsList"></div>

        <h3>Amis</h3>
        <div id="friendsList"></div>

        <button
            data-close="friendsScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- PARAMÈTRES -->

<div id="settingsScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>⚙️ Paramètres</h1>

        <label>
            <input
                id="soundToggle"
                type="checkbox"
                checked>
            Sons
        </label>

        <br><br>

        <label>
            <input
                id="musicToggle"
                type="checkbox"
                checked>
            Musique
        </label>

        <button
            id="changeUsernameButton"
            class="menuButton">
            ✏️ Changer de pseudo
        </button>

        <button
            id="logoutButton"
            class="menuButton">
            🚪 Déconnexion
        </button>

        <button
            data-close="settingsScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- CHANGER PSEUDO -->

<div id="usernameScreen" class="screen hidden">
    <div class="menuContainer">

        <h1>✏️ Nouveau pseudo</h1>

        <input
            id="newUsernameInput"
            placeholder="Nouveau pseudo">

        <button
            id="confirmUsernameButton"
            class="primaryButton">
            Modifier
        </button>

        <p
            id="usernameMessage"
            class="message">
        </p>

        <button
            data-close="usernameScreen"
            class="menuButton">
            ← Retour
        </button>

    </div>
</div>


<!-- JEU 3D -->

<div id="gameHud" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <div class="hudTop">

        <div class="hudBox">
            👤 <span id="hudPlayerName">Joueur</span>
        </div>

        <div class="hudBox">
            <span id="hudVehicle">🚗 Voiture</span>
        </div>

    </div>

    <div class="hudButtons">

        <button
            id="mapButton"
            class="hudButton">
            🗺️ Carte
        </button>

        <button
            id="menuGameButton"
            class="hudButton">
            ☰ Menu
        </button>

        <button
            id="enterVehicleButton"
            class="hudButton">
            🚗 Entrer
        </button>

        <button
            id="exitVehicleButton"
            class="hudButton">
            🚶 Sortir
        </button>

    </div>

    <!-- JOYSTICK UNIQUEMENT -->

    <div id="joystick">
        <div id="joystickStick"></div>
    </div>

</div>


<!-- CARTE -->

<div id="mapScreen" class="hidden">

    <canvas id="mapCanvas"></canvas>

    <div class="mapTop">

        <button id="closeMapButton">
            ✕ Fermer
        </button>

        <div>
            <button id="mapZoomOut">−</button>
            <button id="mapZoomIn">+</button>
        </div>

    </div>

</div>


<!-- PAUSE -->

<div id="pauseScreen" class="pauseOverlay hidden">

    <div class="pauseBox">

        <h1>⏸️ Pause</h1>

        <button
            id="resumeButton"
            class="primaryButton">
            ▶️ Reprendre
        </button>

        <button
            id="pauseSettingsButton"
            class="menuButton">
            ⚙️ Paramètres
        </button>

        <button
            id="exitGameButton"
            class="menuButton">
            🚪 Quitter
        </button>

    </div>

</div>


<div id="notifications"></div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="game.js"></script>

</body>
</html>
